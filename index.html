<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quik Converter | Smart Workspace</title>
    <style>
        /* --- CSS VARIABLES & THEME --- */
        :root {
            --primary: #2563eb; /* Strong Blue */
            --primary-hover: #1d4ed8;
            --bg: #f8f9fa;
            --surface: #ffffff;
            --text: #333333;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --accent-green: #10b981;
        }

        [data-theme="dark"] {
            --primary: #3b82f6;
            --bg: #111827;
            --surface: #1f2937;
            --text: #f3f4f6;
            --text-light: #9ca3af;
            --border: #374151;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        /* --- GLOBAL RESET --- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; transition: background 0.3s, color 0.3s; }
        body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }

        /* --- LAYOUT --- */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; gap: 20px; flex: 1; }
        .main-content { flex: 3; padding-top: 20px; }
        .sidebar { flex: 1; background: var(--surface); border-left: 1px solid var(--border); padding: 20px; height: 100vh; position: sticky; top: 0; overflow-y: auto; display: none; }
        @media(min-width: 1024px) { .sidebar { display: block; } }

        /* --- HEADER --- */
        header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 15px 0; position: sticky; top: 0; z-index: 100; }
        .nav-flex { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .logo { font-weight: 800; font-size: 1.5rem; color: var(--primary); text-decoration: none; }
        
        /* Search Bar (Natural Language) */
        .smart-search { position: relative; width: 400px; }
        .smart-search input { width: 100%; padding: 10px 15px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none; }
        .smart-search input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2); }

        .theme-toggle { cursor: pointer; background: none; border: none; font-size: 1.2rem; color: var(--text); }

        /* --- HERO / EXPRESS CONVERTER --- */
        .express-section { background: var(--surface); border-radius: 12px; padding: 30px; box-shadow: var(--shadow); margin-bottom: 30px; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .tab { padding: 8px 16px; background: var(--bg); border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.9rem; color: var(--text-light); white-space: nowrap; }
        .tab.active { background: var(--primary); color: white; }

        .converter-ui { display: flex; flex-direction: column; gap: 20px; }
        .input-group { display: grid; grid-template-columns: 1fr auto 1fr; gap: 15px; align-items: center; }
        
        input[type="number"], select { padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 1rem; width: 100%; }
        
        .swap-btn { background: var(--bg); border: 1px solid var(--border); border-radius: 50%; width: 40px; height: 40px; cursor: pointer; color: var(--primary); display: flex; align-items: center; justify-content: center; transition: transform 0.2s; }
        .swap-btn:hover { transform: rotate(180deg); background: var(--border); }

        .result-area { background: var(--bg); padding: 20px; border-radius: 8px; text-align: center; margin-top: 10px; border: 1px solid var(--border); }
        .result-value { font-size: 2rem; font-weight: 700; color: var(--primary); }
        .result-context { margin-top: 10px; font-size: 0.9rem; color: var(--text-light); font-style: italic; }
        
        /* Copy Buttons */
        .copy-actions { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
        .copy-btn { padding: 5px 10px; font-size: 0.8rem; border: 1px solid var(--border); background: var(--surface); cursor: pointer; border-radius: 4px; color: var(--text); }
        .copy-btn:hover { background: var(--bg); }

        /* --- CATEGORY GRID --- */
        .grid-title { margin-bottom: 15px; font-size: 1.2rem; }
        .category-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-bottom: 40px; }
        .cat-card { background: var(--surface); padding: 20px; border-radius: 8px; border: 1px solid var(--border); text-align: center; cursor: pointer; transition: transform 0.2s; }
        .cat-card:hover { transform: translateY(-3px); border-color: var(--primary); }
        .cat-icon { font-size: 1.5rem; margin-bottom: 10px; display: block; }

        /* --- SIDEBAR (HISTORY) --- */
        .sidebar h3 { margin-bottom: 15px; font-size: 1.1rem; }
        .history-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .history-item { background: var(--bg); padding: 10px; border-radius: 6px; border-left: 3px solid var(--primary); cursor: pointer; font-size: 0.9rem; }
        .history-item:hover { background: var(--border); }
        .history-meta { font-size: 0.75rem; color: var(--text-light); display: block; margin-top: 4px; }

        /* --- FOOTER --- */
        footer { background: var(--surface); border-top: 1px solid var(--border); padding: 20px; text-align: center; margin-top: auto; color: var(--text-light); font-size: 0.9rem; }

        @media(max-width: 768px) {
            .input-group { grid-template-columns: 1fr; }
            .swap-btn { margin: 0 auto; transform: rotate(90deg); }
            .swap-btn:hover { transform: rotate(270deg); }
            .smart-search { width: 100%; display: none; /* Hide generic search on mobile for simplicity */ }
        }
    </style>
</head>
<body data-theme="light">

    <header>
        <div class="nav-flex">
            <a href="#" class="logo">Quik Converter</a>
            
            <div class="smart-search">
                <input type="text" id="smartSearch" placeholder="Type '100 km to miles' or '50c to f'...">
            </div>

            <div style="display: flex; gap: 15px; align-items: center;">
                <button class="theme-toggle" id="themeBtn">🌙</button>
            </div>
        </div>
    </header>

    <div class="container">
        <main class="main-content">
            
            <div class="express-section">
                <div class="tabs" id="categoryTabs">
                    </div>

                <div class="converter-ui">
                    <div class="input-group">
                        <div>
                            <label style="font-size: 0.8rem; color: var(--text-light);">Amount</label>
                            <input type="number" id="inputVal" value="1" placeholder="Enter value">
                        </div>
                        
                        <button class="swap-btn" id="swapBtn" title="Swap Units">⇄</button>
                        
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%;">
                            <div>
                                <label style="font-size: 0.8rem; color: var(--text-light);">From</label>
                                <select id="fromUnit"></select>
                            </div>
                            <div>
                                <label style="font-size: 0.8rem; color: var(--text-light);">To</label>
                                <select id="toUnit"></select>
                            </div>
                        </div>
                    </div>

                    <div class="result-area">
                        <div class="result-value" id="resultDisplay">---</div>
                        <div class="result-context" id="contextDisplay"></div>
                        
                        <div class="copy-actions">
                            <button class="copy-btn" onclick="copyResult('text')">Copy Text</button>
                            <button class="copy-btn" onclick="copyResult('json')">Copy JSON</button>
                            <button class="copy-btn" onclick="copyResult('eq')">Copy Equation</button>
                        </div>
                    </div>
                </div>
            </div>

            <h2 class="grid-title">All Converters</h2>
            <div class="category-grid" id="gridContainer">
                </div>

        </main>

        <aside class="sidebar">
            <h3>Recent Conversions</h3>
            <ul class="history-list" id="historyList">
                </ul>
            
            <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">
            
            <h3>Developer Tools</h3>
            <div class="category-grid" style="grid-template-columns: 1fr;">
                <div class="cat-card" onclick="setCategory('data')">💾 Byte Converter</div>
                <div class="cat-card" onclick="setCategory('pixel')">🎨 Px to REM</div>
            </div>
        </aside>
    </div>

    <footer>
        <p>&copy; 2023 Quik Converter. Designed for efficiency.</p>
    </footer>

    <script>
        // --- 1. DATA STRUCTURE ---
        // A scalable map of categories, units, and conversion factors (normalized to base unit)
        const DATA = {
            length: {
                name: "Length",
                icon: "📏",
                base: "m", // meter
                units: {
                    m: { name: "Meter", factor: 1 },
                    km: { name: "Kilometer", factor: 1000 },
                    cm: { name: "Centimeter", factor: 0.01 },
                    mm: { name: "Millimeter", factor: 0.001 },
                    mi: { name: "Mile", factor: 1609.34 },
                    yd: { name: "Yard", factor: 0.9144 },
                    ft: { name: "Foot", factor: 0.3048 },
                    in: { name: "Inch", factor: 0.0254 },
                    ly: { name: "Light Year", factor: 9.461e15 }
                }
            },
            weight: {
                name: "Weight",
                icon: "⚖️",
                base: "g", // gram
                units: {
                    g: { name: "Gram", factor: 1 },
                    kg: { name: "Kilogram", factor: 1000 },
                    mg: { name: "Milligram", factor: 0.001 },
                    lb: { name: "Pound", factor: 453.592 },
                    oz: { name: "Ounce", factor: 28.3495 }
                }
            },
            volume: {
                name: "Volume",
                icon: "💧",
                base: "l",
                units: {
                    l: { name: "Liter", factor: 1 },
                    ml: { name: "Milliliter", factor: 0.001 },
                    gal: { name: "Gallon (US)", factor: 3.78541 },
                    cup: { name: "Cup (US)", factor: 0.236588 }
                }
            },
            temp: {
                name: "Temperature",
                icon: "🌡️",
                isComplex: true, // Requires formulas, not simple factors
                units: {
                    c: { name: "Celsius" },
                    f: { name: "Fahrenheit" },
                    k: { name: "Kelvin" }
                }
            },
            data: {
                name: "Data Storage",
                icon: "💾",
                base: "b", // bit
                units: {
                    b: { name: "Bit", factor: 1 },
                    B: { name: "Byte", factor: 8 },
                    KB: { name: "Kilobyte", factor: 8192 },
                    MB: { name: "Megabyte", factor: 8.389e6 },
                    GB: { name: "Gigabyte", factor: 8.59e9 },
                    TB: { name: "Terabyte", factor: 8.796e12 }
                }
            },
            pixel: {
                name: "Web Layout",
                icon: "💻",
                base: "px",
                units: {
                    px: { name: "Pixel (Base 16)", factor: 1 },
                    rem: { name: "REM (Root 16px)", factor: 16 }
                }
            }
        };

        // --- 2. STATE MANAGEMENT ---
        let currentCategory = 'length';
        let history = JSON.parse(localStorage.getItem('quikHistory')) || [];

        // --- 3. DOM ELEMENTS ---
        const tabsContainer = document.getElementById('categoryTabs');
        const fromSelect = document.getElementById('fromUnit');
        const toSelect = document.getElementById('toUnit');
        const inputVal = document.getElementById('inputVal');
        const resultDisplay = document.getElementById('resultDisplay');
        const contextDisplay = document.getElementById('contextDisplay');
        const gridContainer = document.getElementById('gridContainer');
        const themeBtn = document.getElementById('themeBtn');
        const historyList = document.getElementById('historyList');

        // --- 4. INITIALIZATION ---
        function init() {
            renderTabs();
            renderGrid();
            renderHistory();
            setCategory('length');
            
            // Event Listeners
            inputVal.addEventListener('input', calculate);
            fromSelect.addEventListener('change', calculate);
            toSelect.addEventListener('change', calculate);
            document.getElementById('swapBtn').addEventListener('click', swapUnits);
            
            // Theme logic
            if(localStorage.getItem('theme') === 'dark') document.body.dataset.theme = 'dark';
            themeBtn.addEventListener('click', toggleTheme);

            // Smart Search Listener
            document.getElementById('smartSearch').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleSearch(e.target.value);
            });
        }

        // --- 5. CORE LOGIC ---

        function setCategory(catKey) {
            currentCategory = catKey;
            
            // Update Tabs UI
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            const activeTab = document.querySelector(`.tab[data-key="${catKey}"]`);
            if(activeTab) activeTab.classList.add('active');

            // Populate Select Dropdowns
            const catData = DATA[catKey];
            fromSelect.innerHTML = '';
            toSelect.innerHTML = '';

            Object.keys(catData.units).forEach(unitKey => {
                const unit = catData.units[unitKey];
                const option1 = new Option(unit.name, unitKey);
                const option2 = new Option(unit.name, unitKey);
                fromSelect.add(option1);
                toSelect.add(option2);
            });

            // Set defaults (first and second items usually)
            const keys = Object.keys(catData.units);
            fromSelect.value = keys[0];
            toSelect.value = keys[1] || keys[0];

            calculate();
        }

        function calculate() {
            const val = parseFloat(inputVal.value);
            const from = fromSelect.value;
            const to = toSelect.value;
            const cat = DATA[currentCategory];

            if (isNaN(val)) {
                resultDisplay.innerText = "---";
                contextDisplay.innerText = "";
                return;
            }

            let result = 0;

            if (cat.isComplex && currentCategory === 'temp') {
                // Temperature Formulas
                if(from === to) result = val;
                else if(from === 'c' && to === 'f') result = (val * 9/5) + 32;
                else if(from === 'c' && to === 'k') result = val + 273.15;
                else if(from === 'f' && to === 'c') result = (val - 32) * 5/9;
                else if(from === 'f' && to === 'k') result = (val - 32) * 5/9 + 273.15;
                else if(from === 'k' && to === 'c') result = val - 273.15;
                else if(from === 'k' && to === 'f') result = (val - 273.15) * 9/5 + 32;
            } else {
                // Standard Factor Conversion (Base Unit Method)
                // Value * (FromFactor / ToFactor)
                const fromFactor = cat.units[from].factor;
                const toFactor = cat.units[to].factor;
                result = val * (fromFactor / toFactor);
            }

            // Formatting logic: Integers vs Decimals
            const displayRes = Number.isInteger(result) ? result : parseFloat(result.toFixed(4));
            
            resultDisplay.innerText = `${displayRes} ${cat.units[to].name}`;
            
            // Trigger Visual Context
            generateContext(displayRes, to, currentCategory);

            // Add to History (Debounced ideally, but simple here)
            addToHistory(val, from, displayRes, to);
        }

        // --- 6. VISUAL CONTEXT (The "Aha!" Moment) ---
        function generateContext(val, unit, type) {
            let text = "";
            
            // Simple heuristic rules
            if(type === 'length' && unit === 'm') {
                if(val > 800) text = "🧱 That's nearly the height of the Burj Khalifa!";
                else if(val > 300) text = "🗼 That's about the height of the Eiffel Tower.";
                else if(val > 1.9 && val < 2.2) text = "🏋️ You are taller than The Rock (Dwayne Johnson).";
            } 
            else if(type === 'weight' && unit === 'kg') {
                if(val > 5000) text = "🐘 That's about the weight of an African Elephant.";
                else if(val > 80 && val < 100) text = "💪 Standard heavyweight boxer range.";
            }
            else if(type === 'temp' && unit === 'c') {
                if(val === 100) text = "☕ Water is boiling!";
                if(val === 0) text = "🧊 Water is freezing.";
                if(val > 56) text = "🥵 Hottest recorded temperature on Earth.";
            }
            else if(type === 'pixel' && unit === 'rem') {
                text = "🖥️ Standard accessible scaling for web typography.";
            }

            contextDisplay.innerText = text;
        }

        // --- 7. UTILITIES ---

        function swapUnits() {
            const temp = fromSelect.value;
            fromSelect.value = toSelect.value;
            toSelect.value = temp;
            calculate();
        }

        function renderTabs() {
            tabsContainer.innerHTML = '';
            Object.keys(DATA).forEach(key => {
                const tab = document.createElement('div');
                tab.className = 'tab';
                tab.dataset.key = key;
                tab.innerText = DATA[key].name;
                tab.onclick = () => setCategory(key);
                tabsContainer.appendChild(tab);
            });
        }

        function renderGrid() {
            gridContainer.innerHTML = '';
            Object.keys(DATA).forEach(key => {
                const card = document.createElement('div');
                card.className = 'cat-card';
                card.innerHTML = `<span class="cat-icon">${DATA[key].icon}</span>${DATA[key].name}`;
                card.onclick = () => {
                    setCategory(key);
                    window.scrollTo({top: 0, behavior: 'smooth'});
                };
                gridContainer.appendChild(card);
            });
        }

        function addToHistory(inVal, inUnit, outVal, outUnit) {
            // Prevent duplicates or empty
            const entry = `${inVal} ${inUnit} → ${outVal} ${outUnit}`;
            if (history.length > 0 && history[0].text === entry) return;

            history.unshift({ text: entry, time: new Date().toLocaleTimeString() });
            if(history.length > 10) history.pop();
            
            localStorage.setItem('quikHistory', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            historyList.innerHTML = '';
            history.forEach(h => {
                const li = document.createElement('li');
                li.className = 'history-item';
                li.innerHTML = `
                    <div>${h.text}</div>
                    <span class="history-meta">${h.time}</span>
                `;
                li.onclick = () => {
                    // Smart restore logic could go here (parsing the string back to inputs)
                    alert("Restoring from history: " + h.text); 
                };
                historyList.appendChild(li);
            });
        }

        function handleSearch(query) {
            // Very basic regex parser for "100 m to km"
            const regex = /(\d+)\s*(\w+)\s*(?:to|in)\s*(\w+)/i;
            const match = query.match(regex);
            
            if(match) {
                const amount = match[1];
                const fromU = match[2].toLowerCase();
                const toU = match[3].toLowerCase();

                // Find which category these units belong to
                let foundCat = null;
                Object.keys(DATA).forEach(catKey => {
                    const units = Object.keys(DATA[catKey].units);
                    // Loose check (checking keys, ideally check names too)
                    if(units.includes(fromU) || units.includes(toU)) foundCat = catKey;
                });

                if(foundCat) {
                    setCategory(foundCat);
                    // Wait for DOM update
                    setTimeout(() => {
                        inputVal.value = amount;
                        // Try to set selects if they exist in the list
                        if(fromSelect.querySelector(`option[value="${fromU}"]`)) fromSelect.value = fromU;
                        if(toSelect.querySelector(`option[value="${toU}"]`)) toSelect.value = toU;
                        calculate();
                    }, 50);
                } else {
                    alert("Could not auto-detect units. Please select a category manually.");
                }
            }
        }

        function toggleTheme() {
            const body = document.body;
            if(body.dataset.theme === 'dark') {
                body.dataset.theme = 'light';
                themeBtn.innerText = '🌙';
                localStorage.setItem('theme', 'light');
            } else {
                body.dataset.theme = 'dark';
                themeBtn.innerText = '☀️';
                localStorage.setItem('theme', 'dark');
            }
        }

        function copyResult(type) {
            const val = resultDisplay.innerText;
            let txt = "";
            
            if(type === 'text') txt = val;
            if(type === 'json') {
                txt = JSON.stringify({
                    from: fromSelect.value,
                    to: toSelect.value,
                    input: inputVal.value,
                    result: val
                });
            }
            if(type === 'eq') txt = `${inputVal.value} ${fromSelect.value} = ${val}`;

            navigator.clipboard.writeText(txt).then(() => {
                const original = resultDisplay.style.color;
                resultDisplay.style.color = "var(--accent-green)";
                setTimeout(() => resultDisplay.style.color = original, 500);
            });
        }

        // Start
        init();

    </script>
</body>
</html>
